[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "microthermo"
version = "0.1.0"
description = "Event-driven microscopic thermodynamics laboratory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
accel = ["numba>=0.67,<0.68"]
gui = ["PySide6>=6.8", "pyqtgraph>=0.13"]
test = ["pytest>=8"]

[project.scripts]
microthermo = "microthermo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
